<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>네가 좋은 이유 — 이을</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap');
:root{--paper:#e8dcc0;--rust:#b5512e;--rust-dim:#8a5a3c;--shadow:#1a1512;--glow:#d98a4a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Gowun Dodum',sans-serif;background:var(--shadow);color:var(--paper);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

#start{position:fixed;inset:0;z-index:50;
  background:radial-gradient(circle at 50% 40%,rgba(217,138,74,.20),transparent 58%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.06) 3px 4px),var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;cursor:pointer;text-align:center;padding:24px}
#start .vinyl-start{width:330px;height:330px;image-rendering:auto;animation:spin 16s linear infinite;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
#start h1{font-family:'DotGothic16';font-weight:700;font-size:32px;letter-spacing:1px;line-height:1.3;text-shadow:3px 3px 0 var(--rust),1px 1px 0 var(--rust)}
#start .artist{font-family:'DotGothic16';color:var(--glow);font-size:15px;letter-spacing:4px}
#start .press{font-family:'DotGothic16';font-size:14px;letter-spacing:2px;margin-top:4px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}

#player{position:relative;width:100vw;height:100vh;overflow:hidden;display:flex;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.05) 3px 4px),
    linear-gradient(170deg,#241c16,#3a2a20 60%,#241c16)}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(0,0,0,.6);z-index:5}
.cover-disc{image-rendering:auto;object-fit:contain;animation:spin 16s linear infinite;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.title-plate{font-family:'DotGothic16';font-weight:700;background:rgba(0,0,0,.25);border:3px solid var(--rust-dim);
  box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:12px 20px;text-align:center;letter-spacing:1px}

/* intro overlay messages */
#intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none}
#intro .imsg{position:absolute;font-family:'DotGothic16';font-weight:700;font-size:34px;color:var(--paper);
  text-shadow:0 0 22px rgba(217,138,74,.6),2px 2px 0 var(--rust);opacity:0;text-align:center;padding:0 30px;
  transition:opacity 1.1s ease,transform 1.1s ease;transform:translateY(16px)}
#intro .imsg.show{opacity:1;transform:translateY(0)}
#intro .imsg.gone{opacity:0;transform:translateY(-16px)}

/* BLOCK lyrics */
.lyrics-wrap{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;justify-content:center}
.block{position:absolute;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 26px;opacity:0;transition:opacity 1s ease,transform 1s cubic-bezier(.22,.61,.36,1);
  transform:translateY(28px) scale(.97);pointer-events:none;text-align:center}
.block.show{opacity:1;transform:translateY(0) scale(1)}
.block.out{opacity:0;transform:translateY(-28px) scale(.97)}
.line{font-size:25px;line-height:1.65;text-align:center;padding:5px 0;color:var(--paper);width:100%;
  text-shadow:0 0 18px rgba(217,138,74,.35),2px 2px 0 rgba(181,81,46,.5);
  opacity:0;transform:translateY(12px)}
.block.show .line{animation:lineIn .7s forwards}
@keyframes lineIn{to{opacity:1;transform:translateY(0)}}

.controls{display:flex;flex-direction:column;gap:12px;z-index:6}
.bar{height:7px;background:rgba(0,0,0,.4);position:relative;cursor:pointer;box-shadow:inset 0 0 0 2px var(--rust-dim)}
.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--glow) 0 6px,var(--rust) 6px 8px)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tlab{font-family:'DotGothic16';color:var(--glow);font-size:11px}
.btn{font-family:'DotGothic16';background:var(--paper);color:var(--shadow);border:none;padding:10px 16px;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--rust);transition:transform .08s;letter-spacing:1px}
.btn:active{transform:translate(3px,3px);box-shadow:none}

#player{flex-direction:column;align-items:center;max-width:560px;margin:0 auto}
.pc-left{display:none}
.head{width:100%;padding:26px 24px 8px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:6}
.head .cover-disc{width:130px;height:130px}
.head .title-plate{font-size:18px;width:80%}
.main{flex:1;width:100%;display:flex;flex-direction:column;min-height:0}
.main .controls{padding:14px 22px 28px}

@media (min-width:820px) and (orientation:landscape){
  #player{flex-direction:row;max-width:none}
  .head{display:none}
  .pc-left{display:flex;flex-direction:column;align-items:center;justify-content:center;width:42%;height:100%;gap:30px;padding:40px;z-index:6}
  .pc-left .cover-disc{width:380px;height:380px}
  .pc-left .title-plate{font-size:16px}
  .main{width:58%;height:100%;padding:46px 50px;min-height:0}
  .main .pc-title{display:block !important;font-size:26px;margin-bottom:24px;align-self:flex-start;min-width:55%}
  .main .lyrics-wrap{border:3px solid var(--rust-dim);box-shadow:inset 0 0 40px rgba(0,0,0,.5),5px 5px 0 rgba(0,0,0,.4);background:rgba(0,0,0,.18)}
  .main .controls{padding:18px 4px 0}
  .line{font-size:31px}
  #intro .imsg{font-size:46px}
}
</style>
</head>

const BLOCKS = [{"start": 22, "end": 44, "lines": ["내 메모장에는", "1부터 100까지", "너가 좋아하는 거", "너가 좋아했던 거리", "꼭 다시 오자며 눌러 놓았던 즐겨찾기", "이런 내 노력을 너도 알아주겠지 언젠간"]}, {"start": 44, "end": 64, "lines": ["But 또 아닌 듯이", "매일 같은 질문을 해", "오늘 처음 보는 사람처럼", "왜 자꾸 물어봐", "네가 왜 좋은지", "그게 뭐 그렇게 궁금해?"]}, {"start": 64, "end": 85, "lines": ["네가 좋은 이유?", "널 좋아하는 이유?", "다 됐고 그냥 너니까", "아 몰라 그냥 너니까", "무슨 이유를 물어 우리 사랑에", "그런 건 필요 없을 것 같아"]}, {"start": 85, "end": 107, "lines": ["네가 좋은 이유", "널 사랑하는 이유를", "다 나열하지 않아도", "굳이 따지지 않아도", "무슨 그런걸 물어 나의 사랑에", "난 그냥 너라서 좋은거야"]}, {"start": 107, "end": 118, "lines": ["사실 아직 모르겠어 잘", "이건 너가 원한 말이", "왜인지 아닌 것 같더라고", "\"오늘따라 더 예쁜 것 같아\"", "이런 말 이제는 진부할 테니까"]}, {"start": 118, "end": 129, "lines": ["\"성격이 좋아서\"", "\"나랑 잘 맞아서\"", "\"눈웃음이 예뻐서\"", "근데 이런 거 다 빼놓고 나면", "도대체 뭐가 남아?"]}, {"start": 129, "end": 140, "lines": ["서운해하지마", "귀찮아서 하는 말 아냐", "이유를 나열하자니 너무 많아서", "하나만 고르기 어렵단 말이야", "그렇단 말이야 진짜로"]}, {"start": 140, "end": 149, "lines": ["솔직히 나한테", "너의 존재 자체가 소중해", "아무것도 아니었던 나를 채워준 너"]}, {"start": 149, "end": 171, "lines": ["네가 좋은 이유?", "널 좋아하는 이유?", "다 됐고 그냥 너니까", "아 몰라 그냥 너니까", "무슨 이유를 물어 우리 사랑에", "그런 건 필요 없을 것 같아"]}, {"start": 171, "end": 196, "lines": ["네가 좋은 이유", "널 사랑하는 이유를", "다 나열하지 않아도", "굳이 따지지 않아도", "무슨 그런걸 물어 나의 사랑에", "난 그냥 너라서 좋은거야"]}];
const audio=document.getElementById('audio');
const wrap=document.getElementById('wrap');
const introEl=document.getElementById('intro');
const introMsgs=[...introEl.children].map(el=>({el,t:parseFloat(el.dataset.t)}));

const blockEls=BLOCKS.map(blk=>{
  const d=document.createElement('div');d.className='block';
  blk.lines.forEach(t=>{const p=document.createElement('div');p.className='line';p.textContent=t;d.appendChild(p);});
  wrap.appendChild(d);return d;
});
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}

document.getElementById('start').addEventListener('click',()=>{
  document.getElementById('start').style.display='none';
  document.getElementById('player').style.display='flex';
  audio.play();setTimeout(tick,60);
});

const INTRO_END = BLOCKS[0].start; // 22초
let curBlock=-1, curIntro=-1;
function showBlock(bi){
  blockEls.forEach((el,i)=>{
    if(i===bi){el.classList.remove('out');el.classList.add('show');
      [...el.children].forEach((p,j)=>{p.style.animation='none';p.offsetHeight;p.style.animation=`lineIn .7s ${j*0.12}s forwards`;});
    }else if(i<bi){el.classList.remove('show');el.classList.add('out');}
    else{el.classList.remove('show','out');}
  });
}
function tick(){
  const t=audio.currentTime;
  // 인트로 문구 (0~22초)
  if(t < INTRO_END){
    introEl.style.display='flex';
    let ii=-1;
    for(let i=0;i<introMsgs.length;i++){ if(introMsgs[i].t<=t) ii=i; else break; }
    if(ii!==curIntro){
      curIntro=ii;
      introMsgs.forEach((m,i)=>{
        m.el.classList.remove('show','gone');
        if(i<ii) m.el.classList.add('gone');
        else if(i===ii) m.el.classList.add('show');
      });
    }
  }else{
    if(introEl.style.display!=='none'){ introEl.style.display='none'; }
    let bi=-1;
    for(let i=0;i<BLOCKS.length;i++){ if(BLOCKS[i].start<=t+0.05) bi=i; else break; }
    if(bi!==curBlock && bi>=0){ curBlock=bi; showBlock(bi); }
  }
  const d=audio.duration||1;
  document.getElementById('fill').style.width=(audio.currentTime/d*100)+'%';
  document.getElementById('cur').textContent=fmt(audio.currentTime);
  requestAnimationFrame(tick);
}
audio.addEventListener('loadedmetadata',()=>{document.getElementById('dur').textContent=fmt(audio.duration);});
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{if(audio.paused){audio.play();playBtn.textContent='❚❚';}else{audio.pause();playBtn.textContent='▶';}});
document.getElementById('bar').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;curBlock=-1;curIntro=-1;});
</script>
</body>
</html>
